<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사전 신청 페이지</title>
<style>
  :root { --ink: #1f2933; --muted: #5f6b7a; --line: #d9dee5; --accent: #8a4b20; --soft: #fbf5ef; --bg: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         color: var(--ink); background: var(--bg); font-size: 17px; line-height: 1.65; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .hero { background: var(--soft); padding: 48px 0 40px; border-bottom: 1px solid var(--line); }
  .hero h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1.3; margin: 0 0 12px; }
  .hero p { color: var(--muted); margin: 0 0 20px; }
  section { padding: 32px 0; border-bottom: 1px solid var(--line); }
  h2 { font-size: 1.3rem; margin: 0 0 14px; }
  ul.check { list-style: none; padding: 0; margin: 0; }
  ul.check li { padding: 8px 0 8px 30px; position: relative; }
  ul.check li::before { content: "✓"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .step { border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .step b { color: var(--accent); }
  .price { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .about { white-space: pre-line; }
  form { display: grid; gap: 12px; }
  label { font-weight: 600; }
  input, select { width: 100%; padding: 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  .agree { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; color: var(--muted); font-size: .95rem; }
  .agree input { width: auto; margin-top: 5px; }
  button, .cta { font: inherit; font-weight: 700; padding: 14px 20px; border-radius: 10px; border: none;
                 background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
  button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); font-weight: 600; padding: 10px 14px; }
  #formMsg { min-height: 1.6em; color: var(--accent); font-weight: 600; }
  .admin { background: #f6f7f9; font-size: .95rem; }
  .admin p { color: var(--muted); }
</style>
</head>
<body>
<div class="hero">
  <div class="wrap">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <a class="cta" href="#apply" id="ctaTop"></a>
  </div>
</div>

<main class="wrap">
  <section>
    <h2>이런 분께 필요해요</h2>
    <ul class="check" id="forWhom"></ul>
  </section>

  <section>
    <h2>진행 방식</h2>
    <div class="steps" id="steps"></div>
  </section>

  <section>
    <h2>가격</h2>
    <p class="price" id="price"></p>
    <p id="priceNote"></p>
  </section>

  <section>
    <h2>진행자 소개</h2>
    <p class="about" id="about"></p>
  </section>

  <section id="apply">
    <h2>사전 신청</h2>
    <form id="applyForm" novalidate>
      <label for="fName">이름</label>
      <input id="fName" name="name" autocomplete="name" required>
      <label for="fContact">연락처 (휴대폰 또는 이메일)</label>
      <input id="fContact" name="contact" required>
      <label for="fPain">지금 가장 고민되는 점 (선택)</label>
      <input id="fPain" name="pain" placeholder="예: 지난달에도 신입이 그만뒀어요">
      <label class="agree"><input type="checkbox" id="fAgree"> <span id="agreeText"></span></label>
      <button type="submit" id="submitBtn"></button>
      <p id="formMsg" role="status"></p>
    </form>
  </section>
</main>

<section class="admin">
  <div class="wrap">
    <h2>운영자 메뉴</h2>
    <p>신청 정보는 이 브라우저에만 저장됩니다. 실제로 공개할 때는 이 영역을 지우고 신청 버튼을 구글 폼·네이버 폼 링크로 바꾸세요.</p>
    <p>현재 신청 <b id="count">0</b>건</p>
    <button type="button" class="ghost" id="exportBtn">신청 목록 CSV 저장</button>
    <button type="button" class="ghost" id="clearBtn">신청 목록 비우기</button>
  </div>
</section>

<script>
  // ▼ 수강생은 이 OFFER 설정만 business_plan.md의 랜딩페이지 문구로 바꾸면 된다.
  const OFFER = {
    title: "신입이 3개월을 못 버틴다면, 첫 90일을 함께 설계해 드립니다",
    subtitle: "직원 10명 이하 회사 대표님을 위한 1:1 정착 코칭 (4회)",
    cta: "사전 신청하기",
    forWhom: [
      "뽑아 놓은 신입이 몇 달 만에 그만두는 일이 반복되는 대표님",
      "신입에게 무엇부터 가르쳐야 할지 정리가 안 된 대표님",
      "교육 담당자 없이 혼자 채용과 교육을 맡고 계신 대표님",
    ],
    steps: [
      { name: "1회차", desc: "현재 채용·교육 방식 진단" },
      { name: "2회차", desc: "첫 90일 정착 계획표 함께 만들기" },
      { name: "3회차", desc: "첫 주 체크리스트와 면담 질문 준비" },
      { name: "4회차", desc: "실행 점검과 다음 채용 준비" },
    ],
    price: "1회 100,000원 · 4회 패키지 360,000원",
    priceNote: "사전 신청자에게는 무료 30분 진단 상담을 먼저 드립니다.",
    about: "중소기업 인사·교육 분야에서 22년 일했습니다.\n5년간 신입사원 120명을 교육하며 1년 내 퇴사율을 40%에서 15%로 낮춘 경험이 있습니다.",
    agreeText: "상담 일정 안내를 위해 이름과 연락처를 수집·이용하는 데 동의합니다. (신청 확인 후 3개월 뒤 파기)",
  };
  // ▲ 여기까지

  const STORAGE_KEY = "myaiedu-week08-applications";
  const byId = (id) => document.getElementById(id);

  // 화면에는 textContent만 써서 설정값이나 입력값이 HTML로 실행되지 않게 한다.
  function renderOffer(offer) {
    document.title = `${offer.title} | 사전 신청`;
    byId("title").textContent = offer.title;
    byId("subtitle").textContent = offer.subtitle;
    byId("ctaTop").textContent = offer.cta;
    byId("submitBtn").textContent = offer.cta;
    byId("price").textContent = offer.price;
    byId("priceNote").textContent = offer.priceNote;
    byId("about").textContent = offer.about;
    byId("agreeText").textContent = offer.agreeText;
    byId("forWhom").replaceChildren(...offer.forWhom.map((text) => {
      const li = document.createElement("li");
      li.textContent = text;
      return li;
    }));
    byId("steps").replaceChildren(...offer.steps.map((step) => {
      const box = document.createElement("div");
      box.className = "step";
      const name = document.createElement("b");
      name.textContent = step.name;
      const desc = document.createElement("div");
      desc.textContent = step.desc;
      box.append(name, desc);
      return box;
    }));
  }

  // 저장소가 막힌 브라우저에서도 페이지는 정상 동작해야 하므로 실패는 빈 목록으로 다룬다.
  function loadApplications() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveApplications(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
  }

  function validate(entry, agreed) {
    if (!entry.name) return "이름을 입력해 주세요.";
    if (!/^[0-9\-+ ]{9,}$/.test(entry.contact) && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(entry.contact)) {
      return "휴대폰 번호나 이메일 형식을 확인해 주세요.";
    }
    if (!agreed) return "개인정보 수집·이용에 동의해 주세요.";
    return "";
  }

  function updateCount() { byId("count").textContent = String(loadApplications().length); }

  // 엑셀에서 수식으로 해석되지 않도록 =,+,-,@로 시작하는 값 앞에 작은따옴표를 붙인다.
  function csvCell(value) {
    const safe = /^[=+\-@]/.test(value) ? `'${value}` : value;
    return `"${safe.replace(/"/g, '""')}"`;
  }

  function exportCsv() {
    const rows = [["신청일시", "이름", "연락처", "고민"], ...loadApplications().map((a) => [a.at, a.name, a.contact, a.pain])];
    const csv = "﻿" + rows.map((r) => r.map((v) => csvCell(String(v ?? ""))).join(",")).join("\r\n");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    link.download = "사전신청_목록.csv";
    link.click();
    URL.revokeObjectURL(link.href);
  }

  byId("applyForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const entry = {
      at: new Date().toLocaleString("ko-KR"),
      name: byId("fName").value.trim(),
      contact: byId("fContact").value.trim(),
      pain: byId("fPain").value.trim(),
    };
    const error = validate(entry, byId("fAgree").checked);
    if (error) { byId("formMsg").textContent = error; return; }
    const saved = saveApplications([...loadApplications(), entry]);
    byId("formMsg").textContent = saved
      ? `${entry.name}님, 사전 신청이 접수되었습니다. 곧 연락드리겠습니다.`
      : "이 브라우저에서는 저장이 막혀 있습니다. 다른 브라우저로 열어 주세요.";
    if (saved) event.target.reset();
    updateCount();
  });
  byId("exportBtn").addEventListener("click", exportCsv);
  byId("clearBtn").addEventListener("click", () => {
    saveApplications([]);
    updateCount();
    byId("formMsg").textContent = "신청 목록을 비웠습니다.";
  });

  renderOffer(OFFER);
  updateCount();
</script>
</body>
</html>
